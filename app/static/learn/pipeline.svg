<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 104" role="img" aria-label="From data to the app: the five steps used to build the model"><title>From data to the app: the five steps used to build the model</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/></marker></defs><rect x="10" y="20" width="120" height="64" rx="10" fill="#e8f0fd" stroke="#0f3c91" stroke-width="1.2"/><text x="70.0" y="48" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#102a43">500 patients</text><text x="70.0" y="67" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#52606d">Padova, 48 events</text><path d="M133 52 H149" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/><rect x="152" y="20" width="120" height="64" rx="10" fill="#e8f0fd" stroke="#0f3c91" stroke-width="1.2"/><text x="212.0" y="48" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#102a43">Prepare</text><text x="212.0" y="67" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#52606d">fill gaps, standardize</text><path d="M275 52 H291" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/><rect x="294" y="20" width="120" height="64" rx="10" fill="#0f3c91" stroke="#0f3c91" stroke-width="1.2"/><text x="354.0" y="48" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#fff">Fit</text><text x="354.0" y="67" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#dbe7fb">logistic + L2 penalty</text><path d="M417 52 H433" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/><rect x="436" y="20" width="120" height="64" rx="10" fill="#e8f0fd" stroke="#0f3c91" stroke-width="1.2"/><text x="496.0" y="48" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#102a43">Validate</text><text x="496.0" y="67" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#52606d">CV × 20, bootstrap</text><path d="M559 52 H575" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/><rect x="578" y="20" width="120" height="64" rx="10" fill="#e8f0fd" stroke="#0f3c91" stroke-width="1.2"/><text x="638.0" y="48" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#102a43">Export</text><text x="638.0" y="67" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#52606d">model.json → app</text></svg>
